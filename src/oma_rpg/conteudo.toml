# Conteúdo do oma-rpg: classes, skills, cartas do tarô, itens da loja e conquistas.
#
# Nomes, tipos e mecânicas das classes vêm do design. Só a árvore do Garoto de
# Programa estava detalhada skill a skill (efeito, custo e requisito); os
# números das outras cinco classes foram escolhidos aqui, no mesmo vocabulário
# de efeitos, e podem ser mudados em ~/.config/oma-rpg/balanceamento.toml.
#
# Efeitos das passivas (valem enquanto a skill está aprendida):
#   xp_pomodoro, xp_commit, xp_quest, bits    +valor% de XP ou de Bits
#   solto                                     commit solto vale +valor pontos percentuais
#   ci_verde                                  CI verde dá +valor pontos percentuais
#   hp_max, mp_max                            +valor no máximo
#   hp_pausa, mp_pausa                        pausa respeitada cura ou dá mana
#   hp_dia                                    a virada do dia cura +valor
#   teto                                      o teto diário sobe valor pomodoros
#   combo_max                                 o combo vai valor mais longe
#   custo_mana                                skills ativas custam valor% menos
#   daily_hp, abandono_hp                     a penalidade cai valor%
#   backup                                    no desmaio, guarda o streak de ontem
#   juros, chefe, virada                      reforçam a mecânica da classe
#   xp_pericia                                +valor% de XP em perícias
#   xp_confirmacao                            +valor% de XP em quests só confirmadas (sem pomodoro)
#   cura_quest                                cura +valor de HP ao concluir uma quest
#   desconto_loja                             desconto de valor% nos itens da loja
#   critico_pct                               valor% de chance de crítico (+50% XP) ao concluir pomodoro/quest
# Efeitos das ativas (gastam mana, uma vez por dia cada):
#   guardar        guarda o pomodoro em andamento sem custo e sem perder o combo
#   proximo_xp     o próximo pomodoro concluído vale +valor%
#   arriscar       o próximo pomodoro vale +valor%, mas abandonar custa o dobro
#   sorte          o próximo pomodoro vale de 0,5x a 2x, sorteado na hora
#   torre          zera o combo e o próximo pomodoro vale +valor%
#   escudo         ignora a próxima perda de HP
#   desfazer_hp    devolve a última perda de HP
#   cura           +valor de HP
#   mana_hp        troca a mana gasta pelo mesmo tanto de HP
#   descartar      dispensa a próxima daily pendente de hoje, sem penalidade
#   combo_mais     o combo sobe valor degraus agora
#   commit_mais    os commits do pomodoro em andamento valem +valor%
#   carta          tira outra carta do dia (Jovem Místico)
#   proxima_quest_xp  a próxima quest concluída vale +valor% de XP e +valor% nas perícias
#   foco_pericia   dobra o XP de perícia na próxima quest concluída (+valor% extra)

